name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload to staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Gate: a type error or malformed frontmatter must never reach the server.
      - run: npm run verify

      - name: Install PHPMailer
        run: composer install --no-dev --working-dir=public/api

      - run: npm run build

      - name: Check staging FTP settings
        env:
          FTP_HOST: ${{ secrets.FTP_HOST || vars.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER || vars.FTP_USER }}
          FTP_PW: ${{ secrets.FTP_PW || vars.FTP_PW }}
        run: |
          missing=
          [ -z "$FTP_HOST" ] && missing="$missing FTP_HOST"
          [ -z "$FTP_USER" ] && missing="$missing FTP_USER"
          [ -z "$FTP_PW" ] && missing="$missing FTP_PW"
          if [ -n "$missing" ]; then
            echo "Missing on the staging environment:$missing"
            echo "Add each name as a secret or a variable. Those are separate tabs, and the environment must be named staging."
            exit 1
          fi

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST || vars.FTP_HOST }}
          username: ${{ secrets.FTP_USER || vars.FTP_USER }}
          password: ${{ secrets.FTP_PW || vars.FTP_PW }}
          protocol: ftps
          local-dir: ./dist/
          # FTP account is scoped to the staging document root.
          server-dir: ./
          # Keeps anything the server owns that the build does not produce.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            cgi-bin/**
